project:
  type: website
  pre-render: python3 scripts/prepare-photos.py
  resources:
    - cv.pdf
    - assets/**

website:
  title: "Marin Girard"
  draft-mode: gone
  page-footer:
    right: "Last updated: June 11, 2026"
  navbar:
    left:
      - text: "Home"
        href: index.qmd
      - text: "Publications"
        href: publications.qmd
      - text: "Blog"
        href: blog.qmd
      - text: "CV"
        href: cv.pdf

format:
  html:
    theme: lumen
    toc: false
    css: styles.css
    include-in-header:
      text: |
        <script>
        document.addEventListener("DOMContentLoaded", function () {
          const cvLinks = document.querySelectorAll('a[href$="cv.pdf"]');
          cvLinks.forEach((link) => {
            link.setAttribute("download", "Marin-Girard-CV.pdf");
          });
        });
        </script>
